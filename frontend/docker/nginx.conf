# Serves the built SPA. Kept as a conf.d server block rather than a whole
# nginx.conf so the base image's own http{} settings (mime types, logging,
# sendfile) still apply.
server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    gzip              on;
    gzip_comp_level   3;
    gzip_types        text/css text/javascript application/javascript application/json;
    gzip_vary         on;

    # Reverse proxy to the backend, so the browser only ever talks to this one
    # port. Set API_BASE_URL=/backend and every call becomes same-origin --
    # no second port to open in a firewall, and no host baked into the bundle.
    #
    # The backend's routes are not under a single prefix (/health/*,
    # /sending_*, /refresh_*, ...), so the prefix is stripped here rather than
    # enumerated: /backend/health/jkb -> /health/jkb.
    location /backend/ {
        # The resolver is the first nameserver of the container (Docker's embedded
        # DNS, or the cluster DNS in Kubernetes), resolved per request via the variable below.
        # A static upstream name would be resolved once at startup and go stale
        # if the backend container is recreated with a different IP.
        resolver __DNS_RESOLVER__ valid=10s ipv6=off;
        set $upstream __BACKEND_UPSTREAM__;

        rewrite ^/backend/(.*)$ /$1 break;
        proxy_pass http://$upstream;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # vueRouterMode is 'history' in quasar.config.js, so any deep link has to
    # fall back to index.html or a refresh on /jkb returns 404 from nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Fonts and images are genuinely immutable, so cache them hard.
    location ~* \.(jpg|jpeg|png|gif|svg|woff2?|ttf|eot)$ {
        access_log off;
        add_header Cache-Control "public, max-age=2592000";
        add_header Vary Accept-Encoding;
    }

    # JS and CSS must NOT be cached that way. The filenames are content-hashed
    # by Vite, which normally makes them immutable -- but the entrypoint
    # rewrites API_BASE_URL inside the built JS at container start, so the same
    # filename can hold different content. A browser holding a 30-day copy
    # keeps calling the old backend address and every request times out, with
    # nothing on screen to say why.
    #
    # no-cache means revalidate, not "do not cache": nginx still answers 304
    # from the ETag when nothing changed, so this costs one small request.
    location ~* \.(js|css)$ {
        access_log off;
        add_header Cache-Control "no-cache";
        add_header Vary Accept-Encoding;
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }
}
